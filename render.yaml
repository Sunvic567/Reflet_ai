# Configure Supabase first; see SUPABASE.md and RENDER.md.
services:
  - type: web
    name: reflect-ai
    runtime: node
    plan: free
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: REFLECT_OWNER_EMAIL
        value: ""
# Uses RENDER_EXTERNAL_URL automatically. Set REFLECT_BASE_URL for a custom domain.
